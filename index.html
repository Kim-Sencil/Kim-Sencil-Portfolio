<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kim Driggs B. Sencil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-page">

        <div class="profile-container">

            <!-- TOP IMAGE -->
            <section class="hero-image">
                <img
                    src="images/top-image.jpg"
                    alt="Profile banner"
                >
            </section>


            <!-- BIOGRAPHY -->
            <section class="biography-card">

                <button
                    class="profile-picture"
                    id="profilePictureButton"
                    aria-label="Enlarge profile picture"
                >
                    <img
                        src="images/profile.jpg"
                        alt="Kim Driggs B. Sencil"
                    >
                </button>

                <div class="biography-content">

                    <h1>Kim Driggs B. Sencil</h1>

                    <div class="red-divider"></div>

                    <p>
                        I am Kim Driggs B. Sencil. I am currently 17 years
                        of age and reside in Luinab, Iligan City. As of this
                        year I am enrolled in Iligan City National High School
                        in 12th grade Senior High School.
                    </p>

                </div>

            </section>


            <!-- THREE INFORMATION CARDS -->
            <section class="profile-buttons">

                <button
                    class="profile-button contact-button"
                    data-section="contact"
                    aria-expanded="false"
                >
                    <div class="button-pattern">
                        <span>Contact Info:</span>
                        <div class="button-line"></div>
                        <small>Get in touch</small>
                    </div>
                </button>


                <button
                    class="profile-button skills-button"
                    data-section="skills"
                    aria-expanded="false"
                >
                    <div class="button-pattern">
                        <span>Skills and<br>Weaknesses</span>
                        <div class="button-line"></div>
                        <small>Strengths & limitations</small>
                    </div>
                </button>


                <button
                    class="profile-button additional-button"
                    data-section="additional"
                    aria-expanded="false"
                >
                    <div class="button-pattern">
                        <span>Additional<br>Info</span>
                        <div class="button-line"></div>
                        <small>More about me</small>
                    </div>
                </button>

            </section>


            <!-- ONE SHARED EXPANDING TAB -->
            <section
                class="details-panel"
                id="detailsPanel"
                aria-hidden="true"
            >
                <div
                    class="details-content"
                    id="detailsContent"
                ></div>
            </section>

        </div>

    </main>


    <!-- PFP OVERLAY -->
    <div
        class="pfp-overlay"
        id="pfpOverlay"
        aria-hidden="true"
    >

        <button
            class="overlay-close"
            id="overlayClose"
            aria-label="Close enlarged profile picture"
        >
            ×
        </button>

        <img
            src="images/profile.jpg"
            alt="Enlarged profile picture"
            class="enlarged-profile-picture"
        >

    </div>


    <script src="script.js"></script>

</body>
</html>

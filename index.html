<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>

<body>

    <h1>Welcome!</h1>

    <button onclick="sayHello()">Click Me</button>

    <p id="message"></p>

    <script>
        function sayHello() {
            document.getElementById("message").textContent =
                "Hello! The button works!";
        }
    </script>

</body>
</html>

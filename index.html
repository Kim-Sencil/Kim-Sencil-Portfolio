<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kim Driggs B. Sencil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-page">

        <div class="profile-container">

            <!-- =====================================
                 TOP IMAGE
            ====================================== -->

            <section class="hero-image">
                <img
                    src="images/top-image.jpg"
                    alt="Profile banner"
                >
            </section>


            <!-- =====================================
                 BIOGRAPHY
            ====================================== -->

            <section class="biography-card">

                <!-- Clickable Profile Picture -->
                <button
                    class="profile-picture"
                    id="profilePictureButton"
                    aria-label="Enlarge profile picture"
                >
                    <img
                        src="images/profile.jpg"
                        alt="Kim Driggs B. Sencil"
                    >
                </button>

                <div class="biography-content">

                    <h1>Kim Driggs B. Sencil</h1>

                    <div class="red-divider"></div>

                    <p>
                        I am Kim Driggs B. Sencil. I am currently 17 years
                        of age and reside in Luinab, Iligan City. As of this
                        year I am enrolled in Iligan City National High School
                        in 12th grade Senior High School.
                    </p>

                </div>

            </section>


            <!-- =====================================
                 INFORMATION BUTTONS
            ====================================== -->

            <section class="profile-buttons">

                <!-- CONTACT INFO -->
                <button
                    class="profile-button contact-button"
                    data-section="contact"
                    aria-expanded="false"
                >
                    <div class="button-pattern">

                        <div class="button-symbol">
                            ☎
                        </div>

                        <span>Contact Info:</span>

                        <div class="expand-arrow">
                            ↓
                        </div>

                    </div>
                </button>


                <!-- SKILLS AND WEAKNESSES -->
                <button
                    class="profile-button skills-button"
                    data-section="skills"
                    aria-expanded="false"
                >
                    <div class="button-pattern">

                        <div class="button-symbol">
                            ✦
                        </div>

                        <span>Skills and Weaknesses</span>

                        <div class="expand-arrow">
                            ↓
                        </div>

                    </div>
                </button>


                <!-- ADDITIONAL INFO -->
                <button
                    class="profile-button additional-button"
                    data-section="additional"
                    aria-expanded="false"
                >
                    <div class="button-pattern">

                        <div class="button-symbol">
                            ☆
                        </div>

                        <span>Additional Info</span>

                        <div class="expand-arrow">
                            ↓
                        </div>

                    </div>
                </button>

            </section>


            <!-- =====================================
                 EXPANDING INFORMATION PANEL
            ====================================== -->

            <section
                class="details-panel"
                id="detailsPanel"
                aria-hidden="true"
            >

                <div class="details-content" id="detailsContent">

                    <!-- JavaScript inserts content here -->

                </div>

            </section>

        </div>

    </main>


    <!-- =========================================
         PROFILE PICTURE OVERLAY
    ========================================== -->

    <div
        class="pfp-overlay"
        id="pfpOverlay"
        aria-hidden="true"
    >

        <button
            class="overlay-close"
            id="overlayClose"
            aria-label="Close enlarged profile picture"
        >
            ×
        </button>

        <img
            src="images/profile.jpg"
            alt="Enlarged profile picture"
            class="enlarged-profile-picture"
        >

    </div>


    <script src="script.js"></script>

</body>
</html>
